<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Painting One, AR Build</title>

<!-- three.js first: ar-threex is a UMD bundle that reads the global THREE.
     AR.js 3.4.7's three.js build only touches Matrix4 / Quaternion / Vector3, so
     it is happy with r128, and its ARToolKit wasm is inlined — no extra fetches. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- vendored from https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex.js
     so the piece still runs on a phone with no internet, e.g. over a LAN server -->
<script src="vendor/ar-threex.js"></script>

<style>
  *{ box-sizing: border-box; }
  /* The black backdrop lives on <html>, NOT on <body>, and that is load-bearing.
     AR.js appends the webcam <video> and writes zIndex="-2" onto it inline. A negative
     z-index child paints *below* the in-flow block backgrounds of its stacking context,
     so an opaque background on <body> covers the camera feed completely — black screen,
     and the video is not even hit-testable. Keep <body> transparent. */
  html{ background:#000; }
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background: transparent;
    color:#E7EEEC;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
  }

  /* AR.js already sizes the video to cover the window at its true aspect and centres it
     with negative margins, and copies that exact box to the canvas. Don't add object-fit
     here: a second crop would slide the video out from under the render. */
  body > video, canvas{ position:absolute; top:0; left:0; }
  /* !important is the point: AR.js sets zIndex="-2" as an inline style, and an inline
     declaration outranks a normal rule from this stylesheet. An author !important
     declaration outranks the inline one, so this is the only way to pull the feed back
     in front without reaching into AR.js. */
  body > video{ z-index:0 !important; }
  canvas{ z-index:1; }

  #ui{
    position:absolute; inset:0; z-index:2;
    pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  #status{
    align-self:flex-start;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; line-height:1.7;
    background: rgba(10,14,15,.62); backdrop-filter: blur(6px);
    border: 1px solid rgba(231,238,236,.16); border-radius: 5px;
    padding: 8px 11px; color: #A7B4B1; max-width: 62vw;
  }
  #status b{ color:#E7EEEC; display:block; margin-bottom:4px;
    letter-spacing:.06em; text-transform:uppercase; font-size:10px; }
  #status .ok{ color:#6FD39C; }
  #status .fail{ color:#E8705C; }
  #status.hide{ opacity:0; transition: opacity .4s ease; }

  #hint{
    align-self:center; text-align:center;
    background: rgba(10,14,15,.62); backdrop-filter: blur(6px);
    border: 1px solid rgba(231,238,236,.16); border-radius: 8px;
    padding: 12px 16px; font-size: 14px; line-height:1.5; max-width: 34ch;
    transition: opacity .35s ease;
  }
  #hint small{ display:block; margin-top:6px; color:#A7B4B1; font-size:12px; }
  #hint.hide{ opacity:0; }

  /* AR.js looks up '.arjs-loader' and REMOVES that element from the DOM when the
     descriptors finish, so this has to be a div of its own — putting the class on
     anything we still need later would leave us holding a detached node. */
  .arjs-loader{
    position:absolute; inset:0; z-index:4; display:flex;
    align-items:center; justify-content:center; text-align:center;
    /* deliberately translucent: the descriptors take a few seconds, and an opaque
       loader over that whole window is indistinguishable from a dead camera. Letting
       the feed show through means the first thing you see is proof it works. */
    background: rgba(11,15,16,.78); backdrop-filter: blur(3px);
    font-size:14.5px; line-height:1.6;
    transition: opacity .4s ease;
  }
  .arjs-loader.hide{ opacity:0; pointer-events:none; }
  .arjs-loader small{ display:block; margin-top:8px; color:#A7B4B1; font-size:12px; }
  .spin{
    width:26px; height:26px; margin:0 auto 14px;
    border:2px solid rgba(231,238,236,.18); border-top-color:#6FD39C; border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #fatal{
    position:absolute; inset:0; z-index:5; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:#0B0F10; text-align:center; font-size:14.5px; line-height:1.6;
  }
  #fatal.show{ display:flex; }
</style>
</head>
<body>

<div id="ui">
  <div id="status"><b>loading</b></div>
  <div id="hint" class="hide">
    Point the camera at the <b>painting</b>.
    <small>Fill the frame with it and hold steady for a moment.</small>
  </div>
</div>
<div class="arjs-loader" id="loader">
  <div>
    <div class="spin"></div>
    Preparing image tracking
    <small>reading 2&#8239;MB of tracking data</small>
  </div>
</div>
<div id="fatal"><div id="fatalMsg"></div></div>

<script>
(function(){
  var statusEl = document.getElementById('status');
  var hintEl   = document.getElementById('hint');
  var fatalEl  = document.getElementById('fatal');
  var fatalMsg = document.getElementById('fatalMsg');
  var loaderEl = document.getElementById('loader');

  function fatal(msg){
    fatalMsg.innerHTML = msg;
    fatalEl.classList.add('show');
  }

  // ---------------------------------------------------------------------------
  //  AR placement
  // ---------------------------------------------------------------------------
  // The tracked image IS the painting. output/painting1.* was built from a 2644x3526
  // scan at 300 dpi — the same 2644/3526 that ASPECT below is written from — so this is
  // a 1:1 overlay: the animated layers land exactly on the physical artwork.
  //
  // AR.js NFT hands back a marker space in MILLIMETRES whose origin is a CORNER of the
  // tracked image, not its centre. Probed with the image drawn at known pixel
  // coordinates in a synthetic frame (nft-probe.html), the basis solves to:
  //
  //     marker +X  ->  image right        marker -Z  ->  image up
  //     marker +Y  ->  out of the image (the face normal)
  //     image centre sits at (+W/2, 0, -H/2) from the origin
  //
  // 6.7px RMS corner error against a 198px runner-up, so this is measured, not guessed.
  // It is the same basis the Hiro marker used, which is not luck: updateWithModelViewMatrix
  // post-multiplies makeRotationX(+PI/2) for *every* marker type, NFT included. So the
  // -90 about X further down is unchanged from the marker build, and the corner-origin
  // translation is the only genuinely new piece of placement.
  var MM_PER_IN = 25.4;
  // Fallback only — the real figures arrive on arjs-nft-init-data. These were read out of
  // the JPEG embedded in painting1.iset (4-byte header, then JFIF), and the event confirms
  // them exactly: {dpi:300, width:2644, height:3526}.
  var NFT_REF = { width: 2644, height: 3526, dpi: 300 };
  var PAINTING_HEIGHT = NFT_REF.height / NFT_REF.dpi * MM_PER_IN;   // 298.53 mm

  // The flat-screen build exaggerated the layer separation ~15x because a mouse
  // can only fake a parallax that a moving head gets for free. In AR the viewer
  // supplies real parallax, so the same separation reads as a diorama exploding
  // out of the frame. This squashes the depth axis back down without touching any
  // of the per-layer numbers below — turn it up toward 1.0 for the old pop-out.
  var DEPTH_SCALE = 0.35;

  // Image tracking is far jumpier than a pattern marker: the worker posts "not found"
  // for every frame it misses and there is no hysteresis upstream, so the grace window
  // is doing much more work here than it was under Hiro. 1.5s rides out the ordinary
  // dropouts of handheld use at the cost of the art lingering after you turn away.
  var SMOOTH         = 0.35;   // 0 = frozen, 1 = raw marker pose
  var LOST_GRACE_MS  = 1500;

  // Which way the canvas faces is a property of how the marker is printed and laid out,
  // not something that can be settled from here — so every placement number is also
  // overridable from the query string. Find the right values on the phone, then write
  // them into the constants above:
  //   ?yaw=180         spin it about the marker's normal
  //   ?roll=180        turn the artwork upside down in its own plane
  //   ?depth=0.6       override DEPTH_SCALE
  var Q = new URLSearchParams(location.search);
  function qnum(k, dflt){ var v = parseFloat(Q.get(k)); return isNaN(v) ? dflt : v; }
  var YAW  = qnum('yaw', 0)  * Math.PI / 180;
  var ROLL = qnum('roll', 0) * Math.PI / 180;
  if (Q.has('depth')) DEPTH_SCALE = qnum('depth', DEPTH_SCALE);

  // ---------------------------------------------------------------------------
  //  Status readout
  // ---------------------------------------------------------------------------
  var statusLines = {};
  var statusOrder = [];
  function setStatus(key, ok, detail){
    if (statusOrder.indexOf(key) === -1) statusOrder.push(key);
    statusLines[key] = '<span class="' + (ok ? 'ok' : 'fail') + '">' + (ok ? '✓' : '✗') + '</span> ' +
                       key + (detail ? ' — ' + detail : '');
    statusEl.innerHTML = '<b>layers</b>' + statusOrder.map(function(k){
      return statusLines[k] || ('… ' + k);
    }).join('<br>');
  }

  // ---------------------------------------------------------------------------
  //  Renderer / scene / AR camera
  // ---------------------------------------------------------------------------
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  // fully transparent clear, or the webcam feed is painted over
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(640, 480);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();

  // A bare THREE.Camera: AR.js overwrites its projection matrix with one derived
  // from camera_para.dat, so a PerspectiveCamera's own fov/aspect would be thrown
  // away anyway. The old FOV / camDist / resize-to-fit maths goes with it.
  var camera = new THREE.Camera();
  scene.add(camera);

  // markerRoot is written directly by ArMarkerControls; smoothRoot is what the art
  // actually hangs off, chasing it with a lerp.
  var markerRoot = new THREE.Group();
  scene.add(markerRoot);

  var smoothRoot = new THREE.Group();
  smoothRoot.visible = false;
  scene.add(smoothRoot);

  // NFT's origin is a corner of the tracked image, so this group carries the translation
  // that moves it to the centre. It sits above yawGroup so that yaw still means "spin
  // about the image's own centre" rather than about its corner.
  var originFix = new THREE.Group();
  smoothRoot.add(originFix);

  // yaw lives on its own group so it always means the same thing — a spin about the
  // image's normal. Folding it into the painting's own Euler would compose differently.
  var yawGroup = new THREE.Group();
  yawGroup.rotation.y = YAW;
  originFix.add(yawGroup);

  var painting = new THREE.Group();
  // Lay the canvas into the tracked image's plane. -90 about X sends the artwork's
  // up-axis to marker -Z and its normal to marker +Y, which is exactly the basis the
  // probe measured, so this line is unchanged from the marker build.
  painting.rotation.x = -Math.PI / 2;
  painting.rotation.z = ROLL;
  yawGroup.add(painting);

  // Everything above is in millimetres now, so the old 0.001 "hair proud of the paper"
  // would be one micron. 0.5mm is the honest translation — and with depthWrite off on
  // every layer it is belt-and-braces anyway.
  var Z_NUDGE_MM = 0.5;

  // Size and centre the overlay on the tracked image. Called once up front from NFT_REF
  // so nothing depends on an event that might not arrive, then again for real when
  // arjs-nft-init-data reports what the descriptor actually contains.
  var nftGeom = null;
  function applyNftGeometry(width, height, dpi){
    if (!(width > 0 && height > 0 && dpi > 0)) return;
    var wmm = width / dpi * MM_PER_IN, hmm = height / dpi * MM_PER_IN;
    if (nftGeom && Math.abs(nftGeom.hmm - hmm) < 0.01) return;   // nothing changed
    nftGeom = { wmm: wmm, hmm: hmm };

    if (Math.abs((wmm / hmm) / ASPECT - 1) > 0.01){
      console.warn('tracked image aspect', (wmm / hmm).toFixed(5),
                   'disagrees with artwork ASPECT', ASPECT.toFixed(5));
    }
    // marker origin is a corner; slide the art so its centre lands on the image centre
    originFix.position.set(wmm / 2, Z_NUDGE_MM, -hmm / 2);

    var S = hmm / PLANE_H;   // PLANE_H is 2.2, so every tuned constant below survives
    // non-uniform on purpose: x/y place the canvas, z squashes the layer separation
    painting.scale.set(S, S, S * DEPTH_SCALE);
    setStatus('target', true, wmm.toFixed(0) + '×' + hmm.toFixed(0) + 'mm @' + dpi + 'dpi');
  }
  window.addEventListener('arjs-nft-init-data', function(ev){
    var d = ev.detail || {};
    applyNftGeometry(d.width, d.height, d.dpi);
  });

  // ---------------------------------------------------------------------------
  //  The painting itself — unchanged from the parallax build
  // ---------------------------------------------------------------------------
  var ASPECT = 2644 / 3526;
  var PLANE_H = 2.2;
  var PLANE_W = PLANE_H * ASPECT;
  var geo = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
  var geoBend = new THREE.PlaneGeometry(PLANE_W, PLANE_H, 1, 64); // extra vertical segments so a layer can bend

  // Size the overlay now from the measured reference, so the piece is correct even if
  // arjs-nft-init-data never arrives; the event re-applies it if the descriptor differs.
  applyNftGeometry(NFT_REF.width, NFT_REF.height, NFT_REF.dpi);

  var loader = new THREE.TextureLoader();
  var files = {
    background: 'background.png',
    ocean: 'ocean_spritesheet.png',
    hair: 'hair.png',
    branches: 'branches.png',
    bird1: 'bird1.png',
    bird2: 'bird2.png',
    heart: 'heart.png'
  };
  // These are still the exaggerated flat-screen depths. They are deliberately left
  // alone — DEPTH_SCALE above is the one knob that takes them down to AR scale, so
  // the two builds stay comparable layer for layer.
  var depths = {
    background: 0,
    ocean: 0.09,
    hair: 0.24,
    branches: 0.45,
    // The birds perch on the branches, so they belong at essentially the branch's own
    // depth. A hair in front is enough to keep them off it in the sort without letting
    // them drift away from their perch as the viewer moves.
    // bird2 rides a touch in front of bird1 rather than sharing its depth. Every layer
    // is a full-canvas quad and a transparent fragment still writes depth, so two of them
    // at the same z stamp over each other's empty area and one disappears. The gap has to
    // clear the sway wobble the two birds inherit from the branch — that differential
    // peaks around 0.0025, so 0.01 is a comfortable margin, and it still leaves the heart
    // (0.5) safely in front of bird2.
    bird1: 0.47,
    bird2: 0.48,
    heart: 0.5
  };

  var PLAIN_VERT = [
    'varying vec2 vUv;',
    'void main(){',
    '  vUv = uv;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n');

  // Sheet-aware: for a layer with no sheet, uCell is (0,0) and uCellSize is (1,1),
  // which reduces to sampling the plain texture — same output as before.
  var SHEET_FRAG = [
    'varying vec2 vUv;',
    'uniform sampler2D uMap;',
    'uniform vec2 uCell;',
    'uniform vec2 uCellSize;',
    'void main(){',
    '  gl_FragColor = texture2D(uMap, uCell + vUv * uCellSize);',
    '}'
  ].join('\n');

  // The ocean disc's bounding ellipse, measured from ocean.png's own alpha:
  // centre (0.4985, 0.686), half-extents (0.179, 0.189) in canvas UV.
  var DISC = { cx: 0.4985, cy: 0.686, rx: 0.179, ry: 0.189 };

  // Measured from each layer's own alpha: hair occupies v 0.431-0.968, branches
  // v 0.003-0.622. The sway gradient has to be remapped onto that span — written against
  // the whole canvas instead, hair only reached 0.41 of its intended swing, branches 0.48.
  //
  // amp is the primary swing at the free tips, in world units; the plane is 1.65 wide,
  // so 0.10 is roughly a 6% swing and 0.18 about 11%. These are the numbers to turn up
  // or down.
  //
  // guardDisc holds the hair still where it frames the ocean disc. The disc sits in a hole
  // cut through the hair, so those two things can't both be true: either the disc rides the
  // hair (they move as one head, but the ocean reads as moving) or the disc stays put and
  // the hole slides off it, opening a crescent of bare wall. Damping the hair's swing to
  // nothing around the aperture resolves it — the hole stops moving, so the disc doesn't
  // have to follow, and the swing is free to grow toward the loose ends where it's wanted.
  // It's also how hair behaves: constrained where it frames the face, loose at the tips.
  // The heart still borrows BRANCH_SPAN wholesale, amp included, for the original reason.
  var HAIR_SPAN   = { vMin: 0.431, vMax: 0.968, anchorAtTop: true,  phase: 0.0, amp: 0.18, guardDisc: true };
  var BRANCH_SPAN = { vMin: 0.003, vMax: 0.622, anchorAtTop: false, phase: 2.1, amp: 0.10 };

  // Each bird has to do two things at once: rock on the spot, and travel with the branch
  // it is standing on. If it only rocked, it would slide off its perch the moment the
  // branches swayed. The branch displacement is therefore sampled at the perch height
  // only — one constant, not the gradient the branches themselves use — so a bird moves
  // as one rigid body rather than shearing across the 0.12 of v it covers.
  //
  // pivot is each bird's alpha-weighted centroid, measured from its own PNG. It lands in
  // the body mass just above the feet, so the rock reads as tipping on the perch instead
  // of swinging from the tail. To pivot closer to the branch itself, drop v toward the
  // bbox floor (bird1 0.3216, bird2 0.3033).
  //
  // amp is the swing in radians (0.16 is about 9 degrees) and freq the beats per second
  // inside a burst. A bird flaps for BIRD_BURST, then holds still for BIRD_REST; delay
  // staggers the two so they never beat together. That pause is what keeps it from
  // reading as a wind-up toy — a continuous sine is the thing that looks mechanical.
  var BIRD_BURST = 0.90;   // seconds of flapping
  var BIRD_REST  = 1.30;   // seconds of stillness in between
  var BIRD_RAMP  = 0.15;   // ease in and out, so a burst never starts or stops mid-beat
  var BIRDS = {
    bird1: { u: 0.3877, v: 0.3856, amp: 0.16, freq: 3.4, delay: 0.00 },
    bird2: { u: 0.7317, v: 0.3667, amp: 0.14, freq: 3.8, delay: 1.10 }
  };

  function makeBirdVertexShader(bird){
    var cycle = BIRD_BURST + BIRD_REST;
    var f = function(n){ return n.toFixed(5); };
    // pivot from canvas UV into the plane's own coordinates
    var px = f((bird.u - 0.5) * PLANE_W), py = f((bird.v - 0.5) * PLANE_H);
    // BRANCH_SPAN's sway profile, frozen at this bird's perch height
    var bt = Math.min(Math.max((bird.v - BRANCH_SPAN.vMin) / (BRANCH_SPAN.vMax - BRANCH_SPAN.vMin), 0), 1);
    var perch = f(Math.pow(bt, 1.6));
    var A = BRANCH_SPAN.amp, P = BRANCH_SPAN.phase.toFixed(2), V = bird.v;
    return [
      'varying vec2 vUv;',
      'uniform float uTime;',
      'void main(){',
      '  vUv = uv;',
      '  vec3 pos = position;',
      // rock on the perch: a burst of quick beats, then a hold
      '  float tt = mod(uTime + ' + f(bird.delay) + ', ' + f(cycle) + ');',
      '  float env = smoothstep(0.0, ' + f(BIRD_RAMP) + ', tt)',
      '            * (1.0 - smoothstep(' + f(BIRD_BURST - BIRD_RAMP) + ', ' + f(BIRD_BURST) + ', tt));',
      '  float a = ' + f(bird.amp) + ' * sin(6.2831853 * ' + f(bird.freq) + ' * tt) * env;',
      '  float s = sin(a), c = cos(a);',
      '  vec2 d = pos.xy - vec2(' + px + ', ' + py + ');',
      '  pos.xy = vec2(' + px + ', ' + py + ') + vec2(d.x * c - d.y * s, d.x * s + d.y * c);',
      // and ride the branch underneath, rigidly
      '  pos.x += (sin(' + f(V * 6.0) + ' + uTime * 1.1 + ' + P + ') * ' + f(A),
      '          + sin(' + f(V * 16.0) + ' - uTime * 2.4 + ' + P + ') * ' + f(A * 0.28) + ') * ' + perch + ';',
      '  pos.z += cos(' + f(V * 4.0) + ' + uTime * 0.85 + ' + P + ') * ' + f(A * 0.5) + ' * ' + perch + ';',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
      '}'
    ].join('\n');
  }

  // sway=0 at the anchor (top for hair, trunk for branches), reaching 1.0 at the free tips.
  // Two overlapping sine frequencies — a slow primary swing plus a faster small wobble —
  // so it doesn't read as one robotic metronome.
  function makeSwayVertexShader(span){
    var t = '(clamp((uv.y - ' + span.vMin.toFixed(4) + ') / ' +
            (span.vMax - span.vMin).toFixed(4) + ', 0.0, 1.0))';
    var swayTerm = span.anchorAtTop ? 'pow(1.0 - ' + t + ', 1.6)' : 'pow(' + t + ', 1.6)';
    var p = span.phase.toFixed(2);
    var src = [
      'varying vec2 vUv;',
      'uniform float uTime;',
      'void main(){',
      '  vUv = uv;',
      '  vec3 pos = position;',
      '  float sway = ' + swayTerm + ';'
    ];
    if (span.guardDisc){
      // distance from the disc centre in units of its own radii: 1.0 is the disc edge,
      // so the swing is nil at the aperture and full again a little beyond it
      src.push('  vec2 dv = (uv - vec2(' + DISC.cx + ', ' + DISC.cy + ')) / vec2(' + DISC.rx + ', ' + DISC.ry + ');');
      src.push('  sway *= smoothstep(1.05, 2.3, length(dv));');
    }
    src.push(
      '  float wave = sin(uv.y * 6.0 + uTime * 1.1 + ' + p + ') * ' + span.amp.toFixed(3),
      '             + sin(uv.y * 16.0 - uTime * 2.4 + ' + p + ') * ' + (span.amp * 0.28).toFixed(3) + ';',
      '  pos.x += wave * sway;',
      '  pos.z += cos(uv.y * 4.0 + uTime * 0.85 + ' + p + ') * ' + (span.amp * 0.5).toFixed(3) + ' * sway;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
      '}'
    );
    return src.join('\n');
  }

  // Any layer can be driven by a sprite sheet: export <layer>_spritesheet.png, point
  // files[] at it, and add its grid here. Cells run left-to-right then top-to-bottom,
  // and each cell must hold the whole canvas so its UVs line up with every other layer.
  // A layer absent from this map renders as a plain still, exactly as before.
  var sheets = {
    ocean: { cols: 4, rows: 3, frames: 12, fps: 9 }
  };

  function sheetUniforms(key, tex, withTime){
    var s = sheets[key];
    var u = {
      uMap: { value: tex },
      uCell: { value: new THREE.Vector2(0, s ? 1 - 1 / s.rows : 0) },
      uCellSize: { value: new THREE.Vector2(s ? 1 / s.cols : 1, s ? 1 / s.rows : 1) }
    };
    if (withTime) u.uTime = { value: 0 };
    return u;
  }

  function stepSheet(key, mat, t){
    var s = sheets[key];
    var f = Math.floor(t * s.fps) % s.frames;
    // row 0 is the top of the image, but V runs bottom-up, so count the row back from 1
    mat.uniforms.uCell.value.set(
      (f % s.cols) / s.cols,
      1 - (Math.floor(f / s.cols) + 1) / s.rows
    );
  }

  var meshes = {};
  var sheetMats = {};
  var oceanMat = null, hairMat = null, branchesMat = null, heartMat = null;
  var birdMats = [];

  Object.keys(files).forEach(function(key){
    setStatus(key, true, 'loading…');
    loader.load(files[key], function(tex){
      setStatus(key, true, tex.image.naturalWidth + '×' + tex.image.naturalHeight);
      // These sizes aren't powers of two, so WebGL1 can't mipmap them. Without this,
      // three.js quietly rescales every layer through a canvas at load time — wasted
      // CPU and a quality hit. On a sprite sheet it matters twice over: mipmaps would
      // blend neighbouring cells and ghost the next frame into this one.
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      var mat;
      if (key === 'ocean'){
        mat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: sheetUniforms(key, tex, true),
          // The disc holds still. It can do that because the hair's swing is damped to
          // nothing around the aperture (guardDisc on HAIR_SPAN), so the hole no longer
          // slides off it and no crescent of wall opens up. The water's own movement
          // comes from the sheet below, which is what keeps the layer independent.
          vertexShader: PLAIN_VERT,
          // The sheet's 12 frames carry the water motion. Layered on top: a little
          // procedural sun life that costs no frames and no bytes. Sun (0.503, 0.792),
          // horizon (0.717) and disc bottom (0.497) are measured from the artwork itself,
          // not guessed — the previous values had the ripple masked to a band that sat
          // almost entirely below the disc, so it was doing nothing.
          fragmentShader: [
            'varying vec2 vUv;',
            'uniform sampler2D uMap;',
            'uniform float uTime;',
            'uniform vec2 uCell;',
            'uniform vec2 uCellSize;',
            'const float LOOP = 6.0;',
            'void main(){',
            '  float w = 6.2831853 / LOOP;',
            '  float t = mod(uTime, LOOP);',
            // each cell holds the whole canvas, so the layer's own UVs map straight in
            '  vec4 texel = texture2D(uMap, uCell + vUv * uCellSize);',
            '  vec3 col = texel.rgb;',
            '  float alpha = texel.a;',
            '  float swell = 1.0 - smoothstep(0.497, 0.717, vUv.y);',
            '  vec2 sunPos = vec2(0.503, 0.792);',
            '  float colWidth = 0.018 + 0.045 * swell;',
            '  float column = (1.0 - smoothstep(0.0, colWidth, abs(vUv.x - sunPos.x))) * swell;',
            '  float sparkle = sin(vUv.y * 520.0 - 5.0 * w * t) * sin(vUv.x * 95.0 + 3.0 * w * t);',
            '  col += vec3(1.0, 0.88, 0.62) * smoothstep(0.75, 1.0, sparkle) * column * 0.40;',
            // canvas is taller than it is wide, so correct the aspect or the glow is an oval
            '  vec2 p = (vUv - sunPos) * vec2(1.0, 3526.0 / 2644.0);',
            '  float pulse = 0.5 + 0.5 * sin(w * t);',
            '  col += vec3(1.0, 0.72, 0.33) * (1.0 - smoothstep(0.0, 0.045, length(p))) * pulse * 0.30;',
            '  gl_FragColor = vec4(col, alpha);',
            '}'
          ].join('\n')
        });
        oceanMat = mat;
      } else if (key === 'hair' || key === 'branches'){
        // Sway is a transform of the whole shape, so it stays procedural — smoother and
        // far lighter than baking it into frames. A sheet can still drive this layer's
        // texture underneath, for motion a transform can't express.
        var atTop = (key === 'hair');
        mat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: sheetUniforms(key, tex, true),
          vertexShader: makeSwayVertexShader(atTop ? HAIR_SPAN : BRANCH_SPAN),
          fragmentShader: SHEET_FRAG
        });
        if (atTop) hairMat = mat; else branchesMat = mat;
      } else if (key === 'heart'){
        // The heart sits in the branches' cut-out, and the branches aren't guarded around
        // it, so it still has to ride their sway or the hole tears open around it.
        mat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: sheetUniforms(key, tex, true),
          vertexShader: makeSwayVertexShader(BRANCH_SPAN),
          fragmentShader: SHEET_FRAG
        });
        heartMat = mat;
      } else if (BIRDS[key]){
        mat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: sheetUniforms(key, tex, true),
          vertexShader: makeBirdVertexShader(BIRDS[key]),
          fragmentShader: SHEET_FRAG
        });
        birdMats.push(mat);
      } else if (sheets[key]){
        mat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: sheetUniforms(key, tex, false),
          vertexShader: PLAIN_VERT,
          fragmentShader: SHEET_FRAG
        });
      } else {
        mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      }
      if (sheets[key]) sheetMats[key] = mat;
      // only the flat background can skip the extra segments a bend needs
      // a bird only ever rotates and translates as a whole, and the background never
      // moves at all — neither needs the extra rows a bending layer does
      var meshGeo = (key === 'background' || BIRDS[key]) ? geo : geoBend;
      var mesh = new THREE.Mesh(meshGeo, mat);
      mesh.position.z = depths[key];
      // the viewer can now physically walk behind the canvas, so paint the back too
      mat.side = THREE.DoubleSide;
      // DEPTH_SCALE pulls the layers ~3x closer together than the flat-screen build, which
      // is well inside z-fighting range for five transparent, nearly coplanar planes. Let
      // three.js sort them by real view depth — no fixed renderOrder, so the stack also
      // composites correctly when the viewer walks round to the back — and keep them out
      // of the depth buffer so the sway shader's z-wobble can't punch holes in a neighbour.
      mat.depthWrite = false;
      meshes[key] = mesh;
      painting.add(mesh);
    }, undefined, function(err){
      setStatus(key, false, (err && err.message) ? err.message : 'failed to load ' + files[key]);
      console.error('Layer failed to load:', key, files[key], err);
    });
  });

  function heartbeat(t){
    var period = 1.15;
    var tt = (t % period) / period;
    var lub = Math.exp(-Math.pow((tt - 0.05) / 0.035, 2));
    var dub = Math.exp(-Math.pow((tt - 0.22) / 0.045, 2)) * 0.7;
    return 1 + 0.05 * (lub + dub);
  }

  // ---------------------------------------------------------------------------
  //  AR.js: source, context, marker
  // ---------------------------------------------------------------------------
  // Everything AR.js needs is beside this file, so the piece works offline and the
  // usual "wrong baseURL" 404s can't happen.
  THREEx.ArToolkitContext.baseURL = './';

  var arToolkitSource = null;
  var arToolkitContext = null;
  var arMarkerControls = null;
  var contextReady = false;
  var nftLoaded = false;

  // The camera frustum, in millimetres.
  //
  // ARToolKit hardcodes setProjectionNearPlane(0.0001) / setProjectionFarPlane(1000) and
  // the worker's controller is out of reach, so we cannot ask it to use anything else.
  // Under the Hiro marker "1000" meant a thousand marker-widths and was irrelevant. Here
  // the unit is a millimetre, so the far plane sits at one metre and the painting would
  // vanish the moment you stepped back — normal viewing distance for a 30cm artwork.
  // Confirmed from the captured matrix: e[10]=-1.0000, e[14]=-0.0002 solves to
  // near 0.0001, far 1000. Patch the two depth terms directly; nothing else in a
  // perspective matrix depends on them, and with depthWrite off on every layer the
  // depth precision this buys or costs is immaterial.
  var NEAR_MM = 10, FAR_MM = 20000;

  window.addEventListener('arjs-nft-loaded', function(){
    if (nftLoaded) return;
    // AR.js writes the worker's projection into the marker object's own matrix when the
    // 'loaded' message lands, which always precedes this event. Odd, but it is the only
    // route to those intrinsics.
    var m = markerRoot.matrix.clone();
    if (m.elements.some(function(v){ return v !== 0; })){
      camera.projectionMatrix.copy(m);
      var e = camera.projectionMatrix.elements;
      e[10] = -(FAR_MM + NEAR_MM) / (FAR_MM - NEAR_MM);
      e[14] = -2 * FAR_MM * NEAR_MM / (FAR_MM - NEAR_MM);
      if (camera.projectionMatrixInverse){
        camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      }
      setStatus('descriptors', true, 'loaded');
    } else {
      setStatus('descriptors', false, 'no projection');
    }
    // it was never a pose; leave it clean for the first real detection
    markerRoot.matrix.identity();
    nftLoaded = true;
    loaderEl.classList.add('hide');
    hintEl.classList.remove('hide');
  });

  var portrait = window.innerWidth < window.innerHeight;
  arToolkitSource = new THREEx.ArToolkitSource({
    sourceType: 'webcam',
    // ARToolKit works on a 640x480-ish frame; feeding it the phone's full sensor
    // resolution buys nothing and costs a lot of per-frame CPU.
    sourceWidth:  portrait ? 480 : 640,
    sourceHeight: portrait ? 640 : 480,
    displayWidth:  window.innerWidth,
    displayHeight: window.innerHeight
  });

  arToolkitSource.init(function onReady(){
    setStatus('camera', true, 'live');
    // the video has no dimensions until it can play; the context is calibrated from them
    arToolkitSource.domElement.addEventListener('canplay', function(){
      if (!arToolkitContext) initARContext();
      onResize();
    });
    setTimeout(onResize, 1200);
  }, function onError(){
    setStatus('camera', false, 'denied / unavailable');
    fatal('<b>No camera.</b><br><br>The browser refused camera access.<br>' +
          'AR needs <b>https://</b> (or <b>localhost</b>) and permission granted for this site.');
  });

  // A phone ignores the resolution you ask for as often as not: request 480x640 and you
  // are frequently handed 640x480. Track whatever actually arrived, never what we asked
  // for — sizing the detector to the wrong aspect skews every pose it produces.
  function sourceDims(){
    var el = arToolkitSource.domElement;
    return {
      w: el.videoWidth  || arToolkitSource.parameters.sourceWidth,
      h: el.videoHeight || arToolkitSource.parameters.sourceHeight
    };
  }
  function sourceOrientation(){
    var d = sourceDims();
    return d.w > d.h ? 'landscape' : 'portrait';
  }

  function initARContext(){
    var dim = sourceDims();
    arToolkitContext = new THREEx.ArToolkitContext({
      cameraParametersUrl: THREEx.ArToolkitContext.baseURL + 'ar-data/camera_para.dat',
      detectionMode: 'mono',
      // ARToolKit detection is the expensive part; 30Hz is plenty and leaves the GPU
      // free for the shaders above
      maxDetectionRate: 30,
      canvasWidth:  dim.w,
      canvasHeight: dim.h
    });

    arToolkitContext.init(function onCompleted(){
      // A baseline only. For NFT the projection that actually matters is the worker's —
      // it solves the pose against its own ~320px letterboxed canvas and sends back
      // intrinsics to match, so rendering with this one would misalign the overlay.
      // arjs-nft-loaded below replaces it.
      camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());

      // camera_para.dat is calibrated landscape. On a portrait frame ARToolKit has to be
      // told so explicitly, or it reads the marker through a frame rotated 90 degrees and
      // the content lands rotated off the marker. Both fields matter: `orientation` is what
      // the controller uses now, `options.orientation` is what it re-reads internally.
      var o = sourceOrientation();
      arToolkitContext.arController.orientation = o;
      arToolkitContext.arController.options.orientation = o;

      contextReady = true;
      setStatus('camera', true, dim.w + '×' + dim.h + ' ' + o);
      onResize();
    });

    arMarkerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
      type: 'nft',
      // Relative, and deliberately so. The NFT worker resolves this itself as
      // self.origin + '/' + path unless the string passes its own URL regex — and that
      // regex demands a dot-and-TLD, which http://localhost:8765 does not have. Hand it
      // an absolute URL and on localhost you get origin + '/' + origin + '/...' and a
      // 404 that surfaces only as "Error while intizalizing arController". Relative
      // works on both localhost and a real domain. Note it resolves against the site
      // ROOT, not this document, so this breaks if the page moves to a subdirectory.
      descriptorsUrl: 'output/painting1',
      // default mode: move the marker root, leave the camera at the origin
      changeMatrixMode: 'modelViewMatrix'
    });
    markerRoot.visible = false;

    // AR.js builds the whole NFT pipeline inside an 'arjs-video-loaded' listener that
    // ArMarkerControls only registers once context.arController exists. But
    // ArToolkitSource already dispatched that event — synchronously, before it called
    // our onReady — so by now it is long gone and the worker would never start. No
    // error, no descriptors fetched, just nothing ever tracks. Re-dispatch it.
    //
    // Doing it by hand also fixes the sizing: the handler reads clientWidth/clientHeight
    // and then passes them to drawImage as the SOURCE rect, which is in intrinsic pixels.
    // With the video's display size (the window) those disagree and the detector gets a
    // stretched crop of the frame, so hand it the true intrinsic size for that one tick.
    var kicks = 0;
    (function kickNFT(){
      var ac = arToolkitContext.arController;
      // the handler resizes this canvas to its own ~320px box, so an untouched width
      // means it has not run yet and another kick is still worth sending
      if (ac && ac.canvas.width === arToolkitContext.parameters.canvasWidth){
        var el = arToolkitSource.domElement, d = sourceDims();
        var pw = el.style.width, ph = el.style.height;
        el.style.width = d.w + 'px'; el.style.height = d.h + 'px';
        void el.clientWidth;                       // force layout before it reads
        window.dispatchEvent(new CustomEvent('arjs-video-loaded', {
          detail: { component: el }
        }));
        el.style.width = pw; el.style.height = ph;
        onResize();
      }
      if (++kicks < 80) setTimeout(kickNFT, 50);
    })();

    // The worker's only failure path for a bad descriptor is a console.log, so without
    // this a wrong path hangs on the loader for ever with nothing to show the user.
    setTimeout(function(){
      if (!nftLoaded){
        setStatus('descriptors', false, 'timed out');
        fatal('<b>Image tracking failed to start.</b><br><br>' +
              'The descriptors at <code>output/painting1.*</code> did not load.');
      }
    }, 30000);
  }

  function onResize(){
    if (!arToolkitSource || !arToolkitSource.ready) return;
    arToolkitSource.onResizeElement();
    arToolkitSource.copyElementSizeTo(renderer.domElement);
    if (arToolkitContext && arToolkitContext.arController !== null){
      arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
    }
    // copyElementSizeTo only writes CSS. Match the drawing buffer to that same box so
    // the render is sharp instead of a 640x480 buffer stretched across a phone screen —
    // the `false` stops three.js clobbering the style AR.js just set.
    var w = parseFloat(renderer.domElement.style.width);
    var h = parseFloat(renderer.domElement.style.height);
    if (w > 0 && h > 0) renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function(){ setTimeout(onResize, 350); });

  // ---------------------------------------------------------------------------
  //  Render loop
  // ---------------------------------------------------------------------------
  var clock = new THREE.Clock();
  var lastSeen = 0;
  var hasPose = false;
  var seenOnce = false;

  function animate(){
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    if (oceanMat) oceanMat.uniforms.uTime.value = t;
    if (hairMat) hairMat.uniforms.uTime.value = t;
    if (branchesMat) branchesMat.uniforms.uTime.value = t;
    if (heartMat) heartMat.uniforms.uTime.value = t;
    for (var bi = 0; bi < birdMats.length; bi++) birdMats[bi].uniforms.uTime.value = t;
    Object.keys(sheetMats).forEach(function(k){ stepSheet(k, sheetMats[k], t); });
    if (meshes.heart) meshes.heart.scale.setScalar(heartbeat(t));

    if (contextReady && arToolkitSource && arToolkitSource.ready){
      arToolkitContext.update(arToolkitSource.domElement);
    }

    var now = performance.now();
    if (markerRoot.visible){
      lastSeen = now;
      if (!hasPose){
        // first sight, or re-acquisition after a long gap: snap rather than sliding
        // the painting in from wherever it was last seen
        smoothRoot.position.copy(markerRoot.position);
        smoothRoot.quaternion.copy(markerRoot.quaternion);
        smoothRoot.scale.copy(markerRoot.scale);
        hasPose = true;
      } else {
        smoothRoot.position.lerp(markerRoot.position, SMOOTH);
        smoothRoot.quaternion.slerp(markerRoot.quaternion, SMOOTH);
        smoothRoot.scale.lerp(markerRoot.scale, SMOOTH);
      }
      if (!seenOnce){
        seenOnce = true;
        setStatus('tracking', true, 'locked on painting');
        hintEl.classList.add('hide');
        statusEl.classList.add('hide');
      }
    } else if (now - lastSeen > LOST_GRACE_MS){
      hasPose = false;
    }

    // the grace window is what stops a single dropped detection from strobing the art
    smoothRoot.visible = hasPose;

    renderer.render(scene, camera);
  }
  animate();

  if (location.protocol !== 'https:' &&
      location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
    fatal('<b>This page needs https://</b><br><br>Browsers only hand out the camera on a ' +
          'secure origin. Serve the folder over HTTPS, or over http://localhost for desktop testing.');
  }
})();
</script>
</body>
</html>
